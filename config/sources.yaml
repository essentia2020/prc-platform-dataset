# Data sources — endpoints, query templates, rate limits and terms of use.
#
# Only the two sources below are used for counting.  Responses stored under
# data/raw/ are subject to the terms recorded here (see README "Licensing").

sources:

  crossref:
    name: Crossref REST API
    base_url: https://api.crossref.org
    endpoints:
      works: /works
    query_templates:
      works_by_prefix_and_type: >-
        /works?filter=prefix:{doi_prefix},type:{record_type}&rows={rows}&cursor={cursor}&mailto={mailto}
      # `prefix` filters by the current owner prefix (title transfers move
      # ownership without changing the DOI string); `issn` is owner-independent
      # and is used for rows whose records live under a shared owner prefix.
      # Both templates carry the full query on every page: since 24 August
      # 2026 a cursor returns correct results only when all original
      # parameters are repeated, and the cursor changes on every page.
      works_by_issn_and_type: >-
        /works?filter=issn:{issn},type:{record_type}&rows={rows}&cursor={cursor}&mailto={mailto}
      # Windowed walks (D-045 option c, D-057): `{window_filter}` is the
      # from-/until-<field>-date pair of one window; both bounds are inclusive.
      works_by_prefix_type_and_window: >-
        /works?filter=prefix:{doi_prefix},type:{record_type},{window_filter}&rows={rows}&cursor={cursor}&mailto={mailto}
      # Unwindowed total-results probe made before and after a windowed pass.
      works_total_by_prefix_and_type: >-
        /works?filter=prefix:{doi_prefix},type:{record_type}&rows=0&mailto={mailto}
    pagination:
      mode: cursor
      initial_cursor: "*"
      rows: 1000
      total_tolerance: 0
      tolerance_reason: ""
      # Per-scope exceptions to the total-results check, keyed by scope id.
      # Each entry needs `total_tolerance` and a non-empty `reason`; the
      # values are recorded in the walk manifest. Empty by default.
      # Example:
      #   total_tolerance_overrides:
      #     works__10.5194__journal-article:
      #       total_tolerance: 2
      #       reason: "deposits land during the walk; total-results moves by a few records"
      total_tolerance_overrides:
        works__10.12688__journal-article:
          total_tolerance: 50
          reason: "Result set is not stable during cursor walks on the Crossref REST API since the Crossref search backend change of 24 August 2026; deposits registered during the walk move total-results. Observed delta -21 of 30,184 on 2026-10-26. Difference recorded per walk; DOIs are de-duplicated at normalisation."
        works__10.5194__posted-content:
          total_tolerance: 25
          reason: "Same cause; EGUsphere registers preprints continuously. Observed delta +4 of 238,421 on 2026-10-26."
        works__10.7554__peer-review:
          total_tolerance: 25
          reason: "eLife deposits peer-review records continuously during working hours. 
          Observed delta +11 of 84,253 on 2026-10-27: total-results rose monotonically from 84,253 to 84,264 during the 86-page walk and the accepted item total equals the final total-results, so no record was lost."
      # Scopes walked in date windows instead of one cursor walk (D-045
      # option c, D-057). Each window is its own cursor walk at tolerance 0;
      # the scope is complete only when every window is complete and the
      # window totals sum to the unwindowed total-results probed before and
      # after the pass. A scope listed here may not also carry a tolerance
      # override. Windows: a guard before `first_window_start`, calendar
      # periods through the analysis cutoff, and an open guard after.
      windowed_scopes:
        works__10.5256__peer-review:
          date_field: issued
          granularity: quarter
          first_window_start: "2012-07-01"
          reason: "Single cursor walks of this scope lose records between cursor steps (2026-10-27: -31 of 30,197 with a stable total-results, -205 with a moving one) although a yearly created-date probe sums to the unwindowed total, so the set is retrievable; a tolerance would hide the loss, windows of at most two pages avoid it. Quarters by issued date: created dates cluster in 2025-2026 (bulk registration) and would give windows of thousands of records."
      # Only the elements that the Crossref REST API enumerates as selectable
      # may appear here; any other name makes /works answer HTTP 400 for the
      # whole page (the enumeration is returned by the API itself on an
      # invalid select value and is pinned in tests/test_request_rejection.py).
      # `subtype` is not selectable and is therefore not retrieved.
      select_fields: [DOI, type, title, prefix, member, container-title, group-title, created, deposited, issued, posted, published-online, published-print, indexed, relation]
    record_types: [journal-article, posted-content, peer-review]
    rate_limit:
      pool: polite
      note: >-
        Polite pool requires mailto in the query string or User-Agent; honour
        X-Rate-Limit-Limit / X-Rate-Limit-Interval headers and any Retry-After
        header; back off on HTTP 429 and 5xx.
      max_requests_per_second: 1
    licence: >-
      Crossref metadata is made available without restriction (Crossref REST
      API terms of use; metadata is not copyrightable facts, with CC0 waiver
      for the aggregated metadata where applicable). Abstracts and references
      may carry publisher terms; this dataset stores neither.
    licence_url: https://www.crossref.org/documentation/retrieve-metadata/rest-api/rest-api-metadata-license-information/
    terms_url: https://api.crossref.org/swagger-ui/index.html
    coverage_limits: >-
      Only DOIs registered with Crossref; peer-review records only where the
      member deposits type peer-review with relation.is-review-of; dates are
      member-supplied and may carry year or month precision only.
    reproducibility: >-
      The API returns the current state of the index; retrospective deposits,
      corrections and relinking change results between retrievals. The
      immutable raw store and manifests make a given run reproducible from
      its stored responses.

  sciety:
    name: Sciety docmaps
    retrieval_mode: per_group  # full_index is an explicit fallback, never automatic
    base_url: https://sciety.org
    endpoints:
      docmaps_index: /docmaps/v1/index
      docmaps_by_doi: /docmaps/v1/articles/{doi}/docmap.json
      group_page: /groups/{group_slug}
    query_templates:
      docmaps_index: /docmaps/v1/index
      docmaps_by_publisher: /docmaps/v1/index?publisheraccount={group_id}
    pagination:
      mode: paginated_group
      next_paths: [next, links.next]
      completion_rule: exhausted_continuation
      note: >-
        Follow same-endpoint continuation URLs, preserving publisheraccount.
        Complete only after validated articles arrays and absent/null next
        links; empty pages with a continuation are not terminal. Cycles,
        malformed pages or has_more without a continuation fail. The local
        run must confirm these response-field paths. Full-index retrieval
        with explicit partitioning is a fallback, not an automatic retry.
    rate_limit:
      max_requests_per_second: 1
      note: Unauthenticated public endpoint; one request per pagination page.
    licence: >-
      Sciety docmaps are published openly; evaluation texts belong to the
      evaluating groups and are not stored by this dataset (only identifiers,
      dates and types).
    licence_url: https://sciety.org/about
    terms_url: https://sciety.org/legal
    coverage_limits: >-
      Only groups that have joined Sciety and only evaluations ingested from
      the join date onwards; evaluations are keyed to preprint DOIs.
    reproducibility: >-
      The index reflects the current state of Sciety; groups may be added,
      renamed or re-ingested. Each run stores the full index response
      immutably.

http_defaults:
  user_agent_template: "{label}/1.4.0 (mailto:{mailto})"
  timeout_seconds: 60
  max_attempts_per_page: 5
  backoff_seconds: [2, 5, 15, 45, 120]
  accept: application/json
