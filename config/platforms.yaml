        selector_status: verified_journal_list
        selection_rule: >-
          A record is a discussion preprint of a verified journal when its DOI
          matches one of that journal's journal_specific_doi_regex entries
          (the "<stem>d-<volume>-<page>-<year>" regime of the former
          Discussions journals and the "<stem>-<year>-<number>" regime of the
          journal discussion forums) or when it matches the EGUsphere regime
          and is attributed to a verified journal under egusphere_attribution.
          Final articles ("<stem>-<volume>-<page>-<year>") never match the
          journal_specific_doi_regex entries. Record type is not relied upon:
          the former Discussions journals registered discussion papers as
          journal-article, later regimes as posted-content.
        egusphere_regime:
          doi_regex: "^10\\.5194/egusphere-\\d{4}-\\d+$"
          attribution_rule: >-
            EGUsphere hosts both journal-related preprints (interactive public
            peer review for an EGU journal) and stand-alone preprints that
            receive community comments only. An EGUsphere preprint counts for
            this row when any of these signals is observed: is-preprint-of
            resolving to a verified-journal article; a verified journal title
            in container-title / group-title; a Crossref peer-review record
            with is-review-of targeting the preprint. Store every observed
            signal in attribution_basis per record. Unattributed preprints
            stay in interim with included=false and
            exclusion_reason=no_journal_attribution. Yearly coverage_matrix
            records partial_known_scope and the lower-bound limitation.
            Pre-EGUsphere discussion DOIs are attributed by DOI pattern.
            Use register_only only if none of the three EGUsphere signals
            appears in the completed local run (D-032).
          attribution_status: pending_run_confirmation
          since: "journal-dependent; all EGU journals from 2025-01-01 (EGUsphere FAQ)"
        journals_not_using_interactive_review:
