# Platform register — source of truth for PRC Platform Dataset 1.4.0
#
# Rows are observation series, not organisations. One organisation may own
# several rows (linked by organisation_id) when different counting events are
# observed. Series are comparable over time within a row, never between rows.
#
# This file is the only hand-edited register file. config/platforms.csv is
# regenerated from it with `python -m src.common.register --export`.
#
# Controlled vocabularies are defined in config/classification_scheme.md and
# docs/data_dictionary.md. `null` for coverage_end_year means "open series,
# ends at analysis_cutoff_date". `unknown` is permitted for evidence fields;
# invented values are not.
#
# Evidence limitations are stated per row. A recorded user ruling resolves
# classification without turning secondary evidence into primary evidence.

register_meta:
  verified_on_default: "2026-10-20"
  initiation_classes: [author_initiated, community_initiated, mixed]
  prc_configurations: [core_publish_first, approval_threshold, hybrid_public_discussion, review_or_curation_service]
  prc_roles: [integrated_platform, review_service, curation_service, overlay_journal]
  data_sources: [crossref, sciety, both, none]
  register_statuses: [quantified, register_only]
  data_statuses: [machine_readable, not_machine_readable, defunct, partial_coverage]
  statuses: [active, dormant, closed]
  confidences: [high, medium, low]
  arrangements: [platform_own, external_preprint_server, partner_journal, none, unknown]
  output_types: [reviewed_preprint, version_of_record, recommendation, review_report, approval_status, assessment_statement, highlight]
  reviewer_identity_values: [always, optional, never, unknown]
  review_to_object_relations: [crossref_is_review_of, sciety_docmap, both, none, unknown]
  discipline_scopes: [life_sciences, physical_sciences, social_sciences, metaresearch, multidisciplinary]

platforms:

  # ---------------------------------------------------------------- eLife
  - row_id: elife_reviewed_preprints
    row_label: "eLife — Reviewed Preprints"
    organisation_id: elife
    organisation_name: "eLife Sciences Publications Ltd"
    prc_role: integrated_platform
    status: active
    launch_year: 2012
    model_since: 2022
    model_note: >-
      D-060: six Reviewed Preprint postings (posted-content, version 1) dated
      2022 precede the January 2023 public launch of the model (pilot); the
      assumed 2023 boundary was refuted by run_20261027_01 and the series
      starts in 2022. Journal-article records without a posted-content record
      of the same stem are pre-model articles and are outside the row.
    coverage_start_year: 2022
    coverage_end_year: null
    discipline_scope: life_sciences
    country_of_operator: "United Kingdom"
    initiation_class: author_initiated
    classification_confidence: high
    classification_note: >-
      Works enter evaluation only by author submission (direct or transfer of a
      bioRxiv/medRxiv preprint); eLife selects a subset of submissions for
      review and invites reviewers. No route by which the service selects
      works that were not submitted.
    prc_configuration: core_publish_first
    configuration_confidence: high
    configuration_note: >-
      No accept/reject decision after peer review: every reviewed article is
      published as a Reviewed Preprint with Public Reviews and an eLife
      Assessment; authors may later request a Version of Record. Public
      Reviews are signed by eLife, not by individual reviewers.
    provisional: false
    publish_arrangement: external_preprint_server
    review_arrangement: platform_own
    curation_arrangement: platform_own
    output_types: [reviewed_preprint, review_report, assessment_statement, version_of_record]
    public_review_reports: true
    approval_status_public: false
    summary_assessment: true
    reviewer_identity_disclosed: never
    version_linked_review: true
    review_to_object_relation: both
    public_author_response: true
    review_has_doi: true
    data_source: both
    register_status: quantified
    data_status: machine_readable
    doi_prefix: "10.7554"
    doi_pattern: "^10\\.7554/elife\\.\\d+"
    doi_version_pattern: "^(10\\.7554/elife\\.\\d+)(?:\\.\\d+)?(?:\\.sa\\d+)?$"
    sciety_group_slug: elife
    extraction_selector:
      crossref:
        prefix: "10.7554"
        record_types: [posted-content, peer-review, journal-article]
        doi_regex: "^10\\.7554/elife\\.\\d+(\\.\\d+)?(\\.sa\\d+)?$"
        sample_work_doi: "10.7554/elife.91984"
        sample_review_doi: "10.7554/elife.112155.1.sa4"
        notes: >-
          Confirmed by run_20261027_01: Reviewed Preprints are posted-content
          with version suffixes, the version of record of the same stem is a
          journal-article, Public Reviews and Assessments are peer-review
          records with is-review-of relations. A work enters the row only
          through a posted-content record (D-060); journal-article-only stems
          (pre-model workflow, 2012 onwards) are excluded as no_posting_record.
      sciety:
        group_slug: elife
        group_id: b560187e-f2fb-4ff9-a861-a204f3fc0fb0
        group_page_url: https://sciety.org/groups/elife
        role: cross_check
    eligibility_events:
      - first public posting of a Reviewed Preprint (posted-content, version 1)
    counting_event: first_public_posting
    counting_event_date_field: "posted -> issued"
    evidence_url:
      - https://elifesciences.org/about/peer-review
      - https://elifesciences.org/about/submit-your-research
      - https://elifesciences.org/inside-elife/54d63486/elife-s-new-model-changing-the-way-you-share-your-research
      - https://reviewer.elifesciences.org/reviewer-guide/review-process
    verified_on: "2026-10-20"

