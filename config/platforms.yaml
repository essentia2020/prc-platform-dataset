  # -------------------------------------------------------------- JMIRx Med
  - row_id: jmirx_med
    row_label: "JMIRx Med"
    organisation_id: jmir
    organisation_name: "JMIR Publications"
    prc_role: overlay_journal
    status: active
    launch_year: 2020
    model_since: 2020
    model_note: null
    coverage_start_year: 2020
    coverage_end_year: null
    discipline_scope: life_sciences
    country_of_operator: "Canada"
    initiation_class: mixed
    classification_confidence: medium
    classification_note: >-
      Two documented entry routes: editors and community reviewers prospect
      preprints on medRxiv and extend conditional offers ("editorial
      prospecting"), and authors self-nominate existing preprints through a
      submission form. The relative share of the two routes is not published,
      hence medium confidence.
    prc_configuration: core_publish_first
    configuration_confidence: medium
    configuration_note: >-
      Overlay journal on medRxiv and JMIR Preprints: the preprint is public
      before review, peer-review reports and author responses are published
      with the accepted Version of Record, and acceptance is a conventional
      editorial decision. Reports are not public during the review, which
      distinguishes it from Copernicus and SciPost. D-016 assigns
      core_publish_first (medium) as an explicit overlay-journal ruling:
      no public discussion precedes the decision. This assignment does not
      imply absence of an editorial acceptance decision.
    provisional: false
    publish_arrangement: external_preprint_server
    review_arrangement: platform_own
    curation_arrangement: platform_own
    output_types: [version_of_record, review_report]
    public_review_reports: true
    approval_status_public: false
    summary_assessment: false
    reviewer_identity_disclosed: optional
    version_linked_review: false
    review_to_object_relation: unknown
    public_author_response: true
    review_has_doi: true
    data_source: crossref
    register_status: quantified
    data_status: machine_readable
    doi_prefix: "10.2196"
    doi_pattern: "^10\\.2196/"
    doi_version_pattern: null
    sciety_group_slug: null
    extraction_selector:
      # D-050: JMIRx Med deposits no peer-review records; review reports
      # ("Peer Review of …") and author responses ("Authors' Response to Peer
      # Reviews of …") are journal-article records in the same container and
      # are kept as companion items, never counted as works.
      crossref:
        prefix: "10.2196"
        record_types: [journal-article]
        container_titles: ["JMIRx Med"]
        companion_title_regex: "^(Peer Review of |Authors[’'] Response to Peer Reviews? of )"
        sample_work_doi: "10.2196/35862"
        notes: >-
          Prefix 10.2196 covers all JMIR journals; selection is by
          container-title. Peer-review reports and author responses are
          published as companion items with their own DOIs and deposited as
          journal-article records (run_20261026_01: 316 + 104 of 622 records
          in the container); they carry has-preprint, not is-review-of, and
          are not attributed to articles.
    eligibility_events:
      - published Version of Record (journal-article, container-title JMIRx Med) of a reviewed preprint
    counting_event: final_article
    counting_event_date_field: issued
    evidence_url:
      - https://xmed.jmir.org/
      - https://support.jmir.org/hc/en-us/articles/360034752692-What-is-JMIRx
    verified_on: "2026-10-20"

  # ----------------------------------------------------- Access Microbiology
  - row_id: access_microbiology
    row_label: "Access Microbiology (open research platform)"
    organisation_id: microbiology_society
    organisation_name: "Microbiology Society"
    prc_role: integrated_platform
    status: active
    launch_year: 2019
    model_since: null
    model_note: >-
      D-017: determine the series start from qualifying events in the completed
      local run, not from an assumed 2023 start. The journal's 2019 launch is
      not the start of the open-platform observation series. D-060: the
      qualifying event is a posted-content record (preprint version .v1/.v2 of
      an acmi.0 stem); conference abstracts and journal-article records without
      a posted-content record of the same stem never set the start.
    coverage_start_year: null
    coverage_end_year: null
    discipline_scope: life_sciences
    country_of_operator: "United Kingdom"
    initiation_class: author_initiated
    classification_confidence: high
    classification_note: >-
      Authors submit; after automated checks the article is posted publicly
      as a preprint with a DOI and then assigned to an editor for transparent
      peer review.
    prc_configuration: hybrid_public_discussion
    configuration_confidence: medium
    configuration_note: >-
      Preprint posted before review; reviewer reports, editor decision and
      author responses are posted with their own DOIs; the editor takes a
      conventional Accept decision leading to a Version of Record. Reports
      appear after the decision rather than during an open discussion, hence
      medium confidence. The classification is approved; series start awaits
