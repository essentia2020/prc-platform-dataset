    doi_pattern: "^10\\.5194/"
    doi_version_pattern: null
    sciety_group_slug: null
    extraction_selector:
      crossref:
        prefix: "10.5194"
        record_types: [journal-article, posted-content, peer-review]
        doi_regex: "^10\\.5194/(?:egusphere-\\d{4}-\\d+|[a-z]+d-\\d+-\\d+-\\d{4}|[a-z]+-\\d{4}-\\d+)$"
        doi_regex_role: >-
          Coarse retrieval filter over the three discussion-preprint DOI
